# FireShare: copy .env.example to .env, set the secrets, then `docker compose up -d`.

# Database and storage settings shared by the app and the cleanup worker.
x-backend-env: &backend-env
  DATABASE_URL: postgres://fireshare:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/fireshare
  S3_ENDPOINT: http://storage:3900
  # Must match s3_region in storage/garage.toml.
  S3_REGION: garage
  S3_BUCKET: ${S3_BUCKET:-fireshare}
  # The app's own storage key, created by storage-init.
  S3_ACCESS_KEY_ID_FILE: /credentials/s3-access-key-id
  S3_SECRET_ACCESS_KEY_FILE: /credentials/s3-secret-access-key

# Every container runs as a non-root user, can't gain privileges (no setuid),
# holds no Linux capabilities, and has a memory limit.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  app:
    image: ghcr.io/notyourburger/fireshare:${FIRESHARE_VERSION:-latest}
    build: .
    restart: unless-stopped
    <<: *hardening
    mem_limit: 1g
    environment:
      <<: *backend-env
      EXPIRY_OPTIONS: ${EXPIRY_OPTIONS:-}
      EXPIRY_DEFAULT: ${EXPIRY_DEFAULT:-}
      UPLOAD_CHUNK_SIZE: ${UPLOAD_CHUNK_SIZE:-}
      UPLOAD_PARALLEL_FILES: ${UPLOAD_PARALLEL_FILES:-}
      UPLOAD_PASSWORD: ${UPLOAD_PASSWORD:-}
      ALLOW_PUBLIC_UPLOAD: ${ALLOW_PUBLIC_UPLOAD:-}
      ABUSE_CONTACT: ${ABUSE_CONTACT:-}
      UPLOAD_ALLOWED_IPS: ${UPLOAD_ALLOWED_IPS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MAX_SHARE_SIZE: ${MAX_SHARE_SIZE:-}
      MAX_FILES_PER_SHARE: ${MAX_FILES_PER_SHARE:-}
      MAX_TOTAL_STORAGE: ${MAX_TOTAL_STORAGE:-}
      UPLOAD_QUOTA_PER_IP: ${UPLOAD_QUOTA_PER_IP:-}
      MAX_ACTIVE_SHARES_PER_IP: ${MAX_ACTIVE_SHARES_PER_IP:-}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-}
      RATE_LIMIT_DOWNLOAD: ${RATE_LIMIT_DOWNLOAD:-}
      TRANSFER_MODE: ${TRANSFER_MODE:-}
      STORAGE_DIRECT_ENDPOINT: ${STORAGE_DIRECT_ENDPOINT:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      DIRECT_NETWORKS: ${DIRECT_NETWORKS:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - storage-credentials:/credentials:ro
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks: [public, internal]

  # Deletes expired and deleted shares after DELETE_GRACE, and abandoned
  # uploads after PENDING_TTL. Internal only: it needs no inbound traffic.
  worker:
    image: ghcr.io/notyourburger/fireshare-worker:${FIRESHARE_VERSION:-latest}
    build:
      context: .
      target: worker
    restart: unless-stopped
    <<: *hardening
    mem_limit: 512m
    environment:
      <<: *backend-env
      DELETE_GRACE: ${DELETE_GRACE:-}
      PENDING_TTL: ${PENDING_TTL:-}
    volumes:
      - storage-credentials:/credentials:ro
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      # The app runs the database migrations.
      app:
        condition: service_started
    networks: [internal]

  db:
    image: postgres:18.1-alpine
    restart: unless-stopped
    <<: *hardening
    # The image's postgres user; the data directory is created owned by it.
    user: postgres
    mem_limit: 512m
    environment:
      POSTGRES_USER: fireshare
      POSTGRES_DB: fireshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireshare -d fireshare"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Gives the storage volumes to the non-root user (1000) that Garage,
  # storage-init, the app and the worker run as, then exits. It holds only
  # CAP_CHOWN, and changes just the two top-level directories.
  storage-volumes:
    image: ghcr.io/notyourburger/fireshare-worker:${FIRESHARE_VERSION:-latest}
    restart: "no"
    <<: *hardening
    cap_add: [CHOWN]
    user: root
    mem_limit: 32m
    entrypoint: ["chown", "1000:1000", "/var/lib/garage", "/credentials"]
    volumes:
      - storage-data:/var/lib/garage
      - storage-credentials:/credentials
    network_mode: none

  # Object storage: Garage, with zstd compression (see storage/garage.toml).
  # Deliberately publishes no ports: the S3 API and the admin API are
  # reachable only over the internal network. The admin token is used only by
  # storage-init; the app and worker get their own key.
  storage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    <<: *hardening
    user: "1000:1000"
    mem_limit: 512m
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./storage/garage.toml:/etc/garage.toml:ro
      - storage-data:/var/lib/garage
    depends_on:
      storage-volumes:
        condition: service_completed_successfully
    networks: [internal]

  # Runs on every start, then exits: gives the storage node its role, creates
  # the private bucket, and creates the app's key, allowed into that bucket
  # only, and writes it where the app and the worker read it.
  storage-init:
    image: ghcr.io/notyourburger/fireshare-worker:${FIRESHARE_VERSION:-latest}
    restart: "no"
    <<: *hardening
    mem_limit: 128m
    command: ["node", "storage-init.cjs"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
      S3_BUCKET: ${S3_BUCKET:-fireshare}
    volumes:
      - storage-credentials:/credentials
    depends_on:
      storage:
        condition: service_started
    networks: [internal]

networks:
  public: {}
  # No route in or out: only containers attached to it can talk to each other.
  internal:
    internal: true

volumes:
  db-data: {}
  storage-data: {}
  storage-credentials: {}
